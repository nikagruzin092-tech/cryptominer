<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>TON Falcon</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- Верхняя панель -->
  <div class="top">
    <span>🦅 TON Falcon</span>
    <b>$TONF</b>
    <strong id="level">LVL 0</strong>
  </div>

  <!-- Карточки -->
  <div class="cards">

    <button onclick="boost()">
      ⚡
      <small id="energy">100/100</small>
      <em>Энергия</em>
    </button>

    <button onclick="upgrade()">
      ⛏
      <small id="power">1</small>
      <em>Сила</em>
    </button>

    <button onclick="daily()">
      🎁
      <small>+1000</small>
      <em>Бонус</em>
    </button>

  </div>

  <!-- Баланс -->
  <div class="balance">
    <span id="balance">0</span>
  </div>

  <!-- Майнинг -->
  <div class="miner">
    <button onclick="mine()">
      🦅
    </button>
  </div>

  <!-- Энергия -->
  <div class="energy">

    <div>
      <span>Энергия</span>

      <button onclick="boost()">
        Восстановить
      </button>

      <span id="energyText">100/100</span>
    </div>

    <div class="bar">
      <i id="energyBar"></i>
    </div>

  </div>

</div>

<!-- Нижнее меню -->
<nav>

  <button class="active" onclick="closeAllModals()">
    ⛏
    <small>Майнинг</small>
  </button>

  <button onclick="openEarn()">
    🎁
    <small>Заработок</small>
  </button>

  <button onclick="rewardedAd()">
    📺
    <small>Реклама</small>
  </button>

  <button onclick="openWithdraw()">
    💰
    <small>Вывод</small>
  </button>

  <button onclick="openFriends()">
    👥
    <small>Друзья</small>
  </button>

</nav>

<!-- Заработок -->
<div class="modal" id="earnModal">

  <div class="box">

    <button class="x" onclick="closeEarn()">×</button>

    <h3>🎁 Заработок</h3>

    <p>
      Получай дополнительные $TONF.
    </p>

    <button
      class="primary"
      onclick="daily(); closeEarn();"
    >
      🎁 Получить ежедневный бонус
    </button>

    <button
      class="primary"
      onclick="rewardedAd(); closeEarn();"
    >
      📺 Смотреть рекламу
    </button>

  </div>

</div>

<!-- Вывод -->
<div class="modal" id="withdrawModal">

  <div class="box">

    <button class="x" onclick="closeWithdraw()">×</button>

    <h3>💰 Вывод $TONF</h3>

    <p>
      Минимальная сумма: 150000 TONF
    </p>

    <input
      id="withdrawAmount"
      type="number"
      placeholder="Сумма"
      min="150000"
    >

    <input
      id="withdrawWallet"
      type="text"
      placeholder="TON кошелёк"
      autocomplete="off"
    >

    <button
      class="primary"
      onclick="withdraw()"
    >
      💸 Создать заявку
    </button>

  </div>

</div>

<!-- Друзья -->
<div class="modal" id="friendsModal">

  <div class="box">

    <button class="x" onclick="closeFriends()">×</button>

    <h3>👥 Друзья</h3>

    <p>
      Приглашай друзей в TON Falcon.
    </p>

    <button
      class="primary"
      onclick="shareBot()"
    >
      📤 Пригласить друга
    </button>

  </div>

</div>

<script>
  function closeAllModals() {
    document.querySelectorAll(".modal").forEach(function(modal) {
      modal.style.display = "none";
    });
  }

  function openEarn() {
    document.getElementById("earnModal").style.display = "flex";
  }

  function closeEarn() {
    document.getElementById("earnModal").style.display = "none";
  }

  function openWithdraw() {
    document.getElementById("withdrawModal").style.display = "flex";
  }

  function closeWithdraw() {
    document.getElementById("withdrawModal").style.display = "none";
  }

  function openFriends() {
    document.getElementById("friendsModal").style.display = "flex";
  }

  function closeFriends() {
    document.getElementById("friendsModal").style.display = "none";
  }

  function shareBot() {
    const url = "https://t.me/my_crypto_miner_game_bot";

    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.openTelegramLink(
        "https://t.me/share/url?url=" +
        encodeURIComponent(url)
      );
    }
  }

  // Обновляем полоску энергии после получения состояния
  const oldRender = window.render;

  window.render = function() {
    if (typeof oldRender === "function") {
      oldRender();
    }

    const energy = document.getElementById("energy");
    const energyText = document.getElementById("energyText");
    const energyBar = document.getElementById("energyBar");

    if (window.state) {
      const current = Number(window.state.energy || 0);
      const max = Number(window.state.maxEnergy || 100);

      if (energy) {
        energy.textContent = current + "/" + max;
      }

      if (energyText) {
        energyText.textContent = current + "/" + max;
      }

      if (energyBar) {
        energyBar.style.width =
          Math.max(0, Math.min(100, current / max * 100)) + "%";
      }
    }
  };

<script src="app.js"></script>
</body>
</html>
