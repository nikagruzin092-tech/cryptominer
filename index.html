<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>TON Falcon</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>🦅 TON Falcon</h1>
      <p>Mining Clicker</p>
    </header>

    <main>

      <section class="balance-card">
        <div class="label">Баланс</div>

        <div id="balance" class="balance">
          0
        </div>

        <div class="currency">
          $TONF
        </div>
      </section>

      <section class="stats">

        <div class="stat">
          <span>⚡ Энергия</span>
          <strong id="energy">100/100</strong>
        </div>

        <div class="stat">
          <span>⛏ Сила</span>
          <strong id="power">1</strong>
        </div>

        <div class="stat">
          <span>⭐ Уровень</span>
          <strong id="level">0</strong>
        </div>

      </section>

      <button
        class="mine-button"
        onclick="mine()"
      >
        ⛏ МАЙНИТЬ
      </button>

      <section class="buttons">

        <button onclick="upgrade()">
          ⬆️ Улучшить
        </button>

        <button onclick="boost()">
          ⚡ Восстановить энергию
        </button>

        <button onclick="daily()">
          🎁 Ежедневный бонус
        </button>

        <button onclick="rewardedAd()">
          📺 Смотреть рекламу
        </button>

      </section>

      <section class="withdraw-card">

        <h2>💰 Вывод</h2>

        <input
          id="withdrawAmount"
          type="number"
          placeholder="Сумма"
          min="150000"
        >

        <input
          id="withdrawWallet"
          type="text"
          placeholder="TON кошелёк"
        >

        <button onclick="withdraw()">
          💸 Создать заявку
        </button>

        <small>
          Минимальная сумма: 150000 TONF
        </small>

      </section>

    </main>

    <footer>
      TON Falcon
    </footer>

  </div>

  <script src="app.js"></script>

</body>
</html>
