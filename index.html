<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoMiner</title>
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Официальный скрипт Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #3b82f6);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .balance-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .balance-title {
            font-size: 14px;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-value {
            font-size: 36px;
            font-weight: 800;
            margin-top: 8px;
            color: #38bdf8;
        }

        .clicker-section {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .mine-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
        }

        .mine-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .actions-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .action-btn:active {
            opacity: 0.8;
        }

        .action-btn.ads {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            color: var(--hint-color);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CryptoMiner</h1>
            <p class="status-msg" id="status">Добро пожаловать в игру!</p>
        </header>

        <div class="balance-card">
            <div class="balance-title">Ваш баланс</div>
            <div class="balance-value" id="balance">0</div>
        </div>

        <div class="clicker-section">
            <button class="mine-btn" onclick="mineCoin()">⛏ Клик</button>
        </div>

        <div class="actions-section">
            <!-- Четко подписанное место размещения рекламы для модерации -->
            <button class="action-btn ads" onclick="showRewardedAd()">
                🎬 Смотреть рекламу (+50 монет)
            </button>
            <button class="action-btn" onclick="buyUpgrade()">
                ⚡ Улучшить кирку (Цена: 100)
            </button>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        let score = 0;
        let power = 1;

        const balanceEl = document.getElementById('balance');
        const statusEl = document.getElementById('status');

        function updateUI() {
            balanceEl.innerText = score;
        }

        function mineCoin() {
            score += power;
            updateUI();
        }

        function buyUpgrade() {
            const cost = 100;
            if (score >= cost) {
                score -= cost;
                power += 1;
                statusEl.innerText = `Куплено улучшение! Сила клика: +${power}`;
                updateUI();
            } else {
                statusEl.innerText = `Недостаточно монет! Нужно ${cost}`;
            }
        }

        // Инициализация Adsgram Controller (Замените 'YOUR_BLOCK_ID' на ваш реальный UnitID из кабинета)
        const adController = window.Adsgram.init({ blockId: "49691" });

        function showRewardedAd() {
            statusEl.innerText = "Загрузка рекламы...";
            adController.show().then((result) => {
                // Пользователь успешно посмотрел рекламу до конца
                score += 50;
                updateUI();
                statusEl.innerText = "Награда получена: +50 монет!";
            }).catch((result) => {
                // Ошибка или пользователь закрыл рекламу раньше времени
                statusEl.innerText = "Реклама не была досмотрена.";
            });
        }
    </script>
</body>
</html>
