<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 {
            color: #f39c12;
            font-size: 42px;
        }
        .upgrade-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .upgrade-btn:disabled {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    <h1 id="balance">0 🟡</h1>
    <p>Доход за клик: +<span id="click-power">1</span></p>

    <div class="coin-btn" onclick="clickCoin()">⛏️</div>

    <button id="upgrade-btn" class="upgrade-btn" onclick="buyUpgrade()">
        Улучшить клик (Цена: <span id="upgrade-cost">10</span>)
    </button>
    
    <button class="upgrade-btn" onclick="showRewardedAd()" style="background-color: #8e44ad;">
        🎁 Бонус +500 монет
    </button>

    <script>
        // Инициализация Telegram SDK
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        // Загрузка сохранённого прогресса
        let balance = parseInt(localStorage.getItem('miner_balance')) || 0;
        let clickPower = parseInt(localStorage.getItem('miner_clickPower')) || 1;
        let upgradeCost = parseInt(localStorage.getItem('miner_upgradeCost')) || 10;

        function updateUI() {
            document.getElementById('balance').innerText = balance + " 🟡";
            document.getElementById('click-power').innerText = clickPower;
            document.getElementById('upgrade-cost').innerText = upgradeCost;

            const btn = document.getElementById('upgrade-btn');
            btn.disabled = balance < upgradeCost;
        }

        function clickCoin() {
            balance += clickPower;
            saveProgress();
            updateUI();
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function buyUpgrade() {
            if (balance >= upgradeCost) {
                balance -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                saveProgress();
                updateUI();
            }
        }

        function saveProgress() {
            localStorage.setItem('miner_balance', balance);
            localStorage.setItem('miner_clickPower', clickPower);
            localStorage.setItem('miner_upgradeCost', upgradeCost);
        }

        updateUI();

        // Инициализация рекламы Adsgram с вашим Block ID (49691)
        const adController = window.Adsgram.init({ blockId: "49691" });

        function showRewardedAd() {
            adController.show()
                .then((result) => {
                    // Пользователь успешно досмотрел рекламу — выдаем награду
                    balance += 500; 
                    saveProgress();
                    updateUI();

                    // Виброотклик при успехе
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                })
                .catch((result) => {
                    console.log("Реклама не была досмотрена");
                });
        }
    </script>
</body>
</html>
