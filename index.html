<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический Майнер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0f7fa;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 15px;
            user-select: none;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        /* Верхняя панель с кнопками меню */
        .top-menu {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #e0f7fa;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #ffd700;
            font-size: 46px;
            margin: 10px 0 5px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-weight: bold;
        }

        .level-indicator {
            font-size: 14px;
            color: #81d4fa;
            margin-bottom: 5px;
        }

        .income-info {
            font-size: 13px;
            color: #a7ffeb;
        }

        /* Кликабельная зона */
        .clicker-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }

        .coin-btn {
            font-size: 130px;
            cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            transition: transform 0.1s ease;
            display: inline-block;
        }
        
        .coin-btn:active {
            transform: scale(0.88);
        }

        .floating-number {
            position: absolute;
            left: 50%;
            top: 20%;
            transform: translateX(-50%);
            color: #00ffcc;
            font-size: 26px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -70px) scale(1.2); }
        }

        /* Панель основных кнопок */
        .actions-panel {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .upgrade-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            width: 100%;
        }

        .upgrade-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .upgrade-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.5;
        }

        /* Модальные окна (Попапы) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.2s ease;
        }

        .modal-content {
            background: #1e1b4b;
            border: 2px solid #4338ca;
            padding: 20px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .modal-header h3 {
            margin: 0;
            color: #ffd700;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff416c;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Верхнее меню -->
    <div class="top-menu">
        <button class="menu-btn" onclick="openModal('ratingModal')">🏆 Рейтинг</button>
        <button class="menu-btn" onclick="openModal('boostsModal')">⚡ Бусты</button>
        <button class="menu-btn" onclick="openModal('settingsModal')">⚙️ Меню</button>
    </div>

    <!-- Основной игровой экран -->
    <div>
        <h1 id="balance">0 🟡</h1>
        <div class="level-indicator">Уровень <span id="level-val">1</span></div>
        <div class="income-info">Доход в мин: +<span id="passive-income">0</span></div>

        <div class="clicker-container" id="clicker-container">
            <div class="coin-btn" onclick="clickCoin(event)">⛏️</div>
        </div>

        <p style="margin: 0; font-size: 14px;">Клик: +<span id="click-power">1</span></p>
    </div>

    <!-- Кнопки действий -->
    <div class="actions-panel">
        <button id="upgrade-btn" class="upgrade-btn" onclick="buyUpgrade()">
            Улучшить клик (Цена: <span id="upgrade-cost">10</span>)
        </button>

        <button class="upgrade-btn" onclick="showRewardedAd()" style="background: linear-gradient(45deg, #8e44ad, #6c3483);">
            💎 СМОТРЕТЬ ЗА +100 монет
        </button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: РЕЙТИНГ -->
    <div id="ratingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🏆 Топ Майнеров</h3>
                <button class="close-btn" onclick="closeModal('ratingModal')">&times;</button>
            </div>
            <div class="modal-item"><span>1. CryptoKing</span> <b>152,400 🟡</b></div>
            <div class="modal-item"><span>2. Satoshi_G</span> <b>98,250 🟡</b></div>
            <div class="modal-item"><span>3. Miner_Pro</span> <b>74,100 🟡</b></div>
            <div class="modal-item" style="border: 1px solid #ffd700;"><span>Вы (Вы)</span> <b id="top-my-score">0 🟡</b></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: БУСТЫ -->
    <div id="boostsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚡ Авто-майнеры</h3>
                <button class="close-btn" onclick="closeModal('boostsModal')">&times;</button>
            </div>
            <p style="font-size: 12px; color: #a7ffeb;">Дают пассивный доход каждую минуту:</p>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button class="upgrade-btn" style="font-size: 14px; padding: 10px;" onclick="buyAutoMiner(50, 5)">
                    Дрон ( +5/мин ) <br>Цена: 50 🟡
                </button>
                <button class="upgrade-btn" style="font-size: 14px; padding: 10px;" onclick="buyAutoMiner(300, 30)">
                    Буровая установка ( +30/мин ) <br>Цена: 300 🟡
                </button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: НАСТРОЙКИ / МЕНЮ -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Настройки</h3>
                <button class="close-btn" onclick="closeModal('settingsModal')">&times;</button>
            </div>
            <p style="font-size: 13px;">Telegram ID: <span id="tg-id">Не определен</span></p>
            <button class="upgrade-btn" style="background: #c0392b; font-size: 14px; padding: 10px; margin-top: 10px;" onclick="resetProgress()">
                🔄 Сбросить прогресс
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById('tg-id').innerText = tg.initDataUnsafe.user.id;
            }
        }

        // Данные игры
        let balance = parseInt(localStorage.getItem('miner_balance')) || 0;
        let clickPower = parseInt(localStorage.getItem('miner_clickPower')) || 1;
        let upgradeCost = parseInt(localStorage.getItem('miner_upgradeCost')) || 10;
        let currentLevel = parseInt(localStorage.getItem('miner_level')) || 1;
        let passiveIncome = parseInt(localStorage.getItem('miner_passive')) || 0;

        function updateUI() {
            document.getElementById('balance').innerText = balance + " 🟡";
            document.getElementById('click-power').innerText = clickPower;
            document.getElementById('upgrade-cost').innerText = upgradeCost;
            document.getElementById('level-val').innerText = currentLevel;
            document.getElementById('passive-income').innerText = passiveIncome;
            document.getElementById('top-my-score').innerText = balance + " 🟡";

            const btn = document.getElementById('upgrade-btn');
            btn.disabled = balance < upgradeCost;
        }

        function clickCoin(event) {
            balance += clickPower;
            saveProgress();
            updateUI();
            showFloatingNumber(event);

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function showFloatingNumber(event) {
            const container = document.getElementById('clicker-container');
            const numEl = document.createElement('div');
            numEl.className = 'floating-number';
            numEl.innerText = "+" + clickPower;

            const randomX = (Math.random() - 0.5) * 40;
            numEl.style.left = `calc(50% + ${randomX}px)`;
            container.appendChild(numEl);

            setTimeout(() => numEl.remove(), 800);
        }

        function buyUpgrade() {
            if (balance >= upgradeCost) {
                balance -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                currentLevel += 1;
                saveProgress();
                updateUI();
            }
        }

        function buyAutoMiner(cost, incomeAdd) {
            if (balance >= cost) {
                balance -= cost;
                passiveIncome += incomeAdd;
                saveProgress();
                updateUI();
                closeModal('boostsModal');
            } else {
                alert("Не хватает монет!");
            }
        }

        // Пассивный доход каждую минуту
        setInterval(() => {
            if (passiveIncome > 0) {
                balance += passiveIncome;
                saveProgress();
                updateUI();
            }
        }, 60000);

        function saveProgress() {
            localStorage.setItem('miner_balance', balance);
            localStorage.setItem('miner_clickPower', clickPower);
            localStorage.setItem('miner_upgradeCost', upgradeCost);
            localStorage.setItem('miner_level', currentLevel);
            localStorage.setItem('miner_passive', passiveIncome);
        }

        function resetProgress() {
            if (confirm("Вы уверены, что хотите сбросить прогресс?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Управление модальными окнами
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        updateUI();

        // Реклама Adsgram (Блок 49691)
        const adController = window.Adsgram.init({ blockId: "49691" });

        function showRewardedAd() {
            adController.show()
                .then((result) => {
                    balance += 100;
                    saveProgress();
                    updateUI();

                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                })
                .catch((result) => {
                    console.log("Реклама не была досмотрена");
                });
        }
    </script>
</body>
</html>
